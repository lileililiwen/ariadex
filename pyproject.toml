[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadex"
dynamic = ["version"]
description = "Human-supervised runtime for long-running AI coding workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ariadex contributors" }]
keywords = ["ai", "coding", "orchestration", "tmux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/anomalyco/opencode"
Security = "https://github.com/anomalyco/opencode/blob/main/SECURITY.md"
Changelog = "https://github.com/anomalyco/opencode/blob/main/CHANGELOG.md"

[project.scripts]
ariadex = "ariadex.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ariadex.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ariadex = ["py.typed"]
