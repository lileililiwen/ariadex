[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadex"
dynamic = ["version"]
description = "Human-supervised runtime for long-running AI coding workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ariadex contributors" }]
keywords = ["ai", "coding", "orchestration", "tmux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6", "psutil>=7"]

[project.optional-dependencies]
# Pinned quality-gate toolchain (see [tool.ruff], [tool.mypy],
# [tool.coverage] below and .github/workflows/ci.yml). Install with:
#   pip install -e ".[dev]"
dev = [
  "build==1.6.1",
  "coverage==7.16.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "ruff==0.16.7",
  "types-PyYAML==6.0.12.20260906",
]

[project.urls]
Homepage = "https://github.com/lileililiwen/ariadex"
Security = "https://github.com/lileililiwen/ariadex/blob/main/SECURITY.md"
Changelog = "https://github.com/lileililiwen/ariadex/blob/main/CHANGELOG.md"

[project.scripts]
ariadex = "ariadex.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ariadex.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ariadex = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F: syntax, unused, undefined. I: import order. UP: py311 idioms.
# B: likely bugs. SIM105/SIM117: mechanical simplifications. C4/RUF: safe
# modernizations. S: subprocess/shell/URL/secret handling, with two
# documented carve-outs below. S607 (partial executable path) stays out:
# host tools (tmux, provider CLIs, package managers) are PATH-resolved by
# design, and fixed paths are used where resolution matters (local-tmux
# wrapper, `require_tmux`). PL and BLE families stay out: they demand
# behavior-affecting changes.
select = ["B", "C4", "E", "F", "I", "RUF", "S", "SIM", "UP", "W"]
ignore = [
  # Scenario and test assertions are intentional fail-closed probes;
  # removing them would weaken the evidence harness.
  "S101",
  # Host tools (tmux, provider CLIs, package managers) are PATH-resolved
  # by design; see the S607 note above.
  "S607",
]
[tool.ruff.lint.per-file-ignores]
# Test fixtures pass "/tmp" workdirs and fixed argv vectors
# (sys.executable, git with literal args) to fakes; no user input reaches
# subprocess and no predictable temp files are created (real temp usage
# goes through `tempfile`). S103/S108/S603 stay enforced on src/.
"tests/*" = ["S103", "S108", "S603"]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["ariadex"]
branch = true

[tool.coverage.report]
# Threshold is the measured 2026-09-12 baseline (82% total across
# src/ariadex under `coverage run -m unittest discover -s tests`).
# Raise it, never lower it.
fail_under = 82
show_missing = true
