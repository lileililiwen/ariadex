# Ariadex release: tag-triggered, fail-closed verification.
#
# Tag the release commit as `ariadex-v<version>` (must equal
# `ariadex.__version__`; a mismatch fails the workflow). Live evidence
# runs with `--gate`, so any skipped or blocked scenario fails the
# release instead of silently passing. Publication uses PyPI trusted
# publishing scoped to this repository and workflow (configure the
# pending publisher on PyPI first); built artifacts are retained here.
#
# Protection: grant this workflow the `release` environment in the repo
# settings with required reviewers, so tags alone cannot ship.

name: Release

on:
  push:
    tags: ["ariadex-v*"]

jobs:
  verify-and-publish:
    name: verify and retain artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
      - run: npm install -g @fission-ai/openspec@1.6.0
      - run: uv sync --frozen --extra dev
      - name: tag matches package version
        run: |
          test "${GITHUB_REF_NAME}" = "ariadex-v$(uv run python -c 'import ariadex; print(ariadex.__version__)')"
      - run: uv run python -m unittest discover -s tests
      - run: openspec validate --changes --strict --no-interactive
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src/ariadex
      - run: uv run coverage run -m unittest discover -s tests
      - run: uv run coverage report
      - run: uv run pip-audit --desc=on .
      - name: ensure tmux and a provider CLI
        run: |
          command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
          command -v opencode || npm install -g opencode-ai@1
      - name: live evidence release gate (blocked and zero-provider fails)
        run: python -m ariadex evidence --release-gate --timeout 180
      - run: uv run python -m build
      - name: release readiness dry run (identity, remote, tag, artifacts, unused version)
        run: uv run python -m ariadex.release --tag "${GITHUB_REF_NAME}" --check-pypi
      - name: verify artifacts and record hashes
        run: |
          ls dist/ariadex-*.tar.gz dist/ariadex-*-py3-none-any.whl
          # Hash record lives outside dist/: twine uploads every file
          # under dist/ and rejects non-distribution files.
          sha256sum dist/ariadex-*.tar.gz dist/ariadex-*-py3-none-any.whl | tee SHA256SUMS.txt
      - name: clean-venv install and smoke test
        run: |
          python -m venv /tmp/releasevenv
          /tmp/releasevenv/bin/pip install dist/ariadex-*-py3-none-any.whl
          /tmp/releasevenv/bin/ariadex --help
          /tmp/releasevenv/bin/ariadex --version
          mkdir -p /tmp/ariadex-release-smoke && cd /tmp/ariadex-release-smoke
          rm -rf .ariadex
          /tmp/releasevenv/bin/ariadex init
          /tmp/releasevenv/bin/ariadex status
      - name: publish to PyPI (trusted publisher, gated on every step above)
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: verify installation from the package index
        run: |
          VERSION="$(uv run python -c 'import ariadex; print(ariadex.__version__)')"
          python -m venv /tmp/pypi-venv
          /tmp/pypi-venv/bin/pip install "ariadex==${VERSION}"
          # Exact comparison: the index must serve the tagged version.
          # Any other resolved version fails the release instead of passing.
          REPORTED="$(/tmp/pypi-venv/bin/ariadex --version)"
          uv run python -m ariadex.release --tag "${GITHUB_REF_NAME}" --verify-published "${REPORTED}"
          mkdir -p /tmp/ariadex-pypi-smoke && cd /tmp/ariadex-pypi-smoke
          rm -rf .ariadex
          /tmp/pypi-venv/bin/ariadex init
          /tmp/pypi-venv/bin/ariadex status
      - name: release summary evidence
        run: |
          VERSION="$(uv run python -c 'import ariadex; print(ariadex.__version__)')"
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo ""
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- package version: \`${VERSION}\`"
            echo "- artifacts:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo "- PyPI verification: clean-index install of \`ariadex==${VERSION}\`"
            echo "  reported \`$(/tmp/pypi-venv/bin/ariadex --version)\` and passed the smoke test"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: ariadex-${{ github.ref_name }}
          path: |
            dist/ariadex-*.tar.gz
            dist/ariadex-*-py3-none-any.whl
            SHA256SUMS.txt
